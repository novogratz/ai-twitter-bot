# Hourly news uses the existing Codex Reply model and login.
search_adapter = "codex"
delivery_adapter = "file" # backups and draft-only mode; main picks use NEWS_AUTO_PUBLISH
prompt_file = "news_prompt.md"
candidates_per_run = 4
model_calls_per_run = 8
model_calls_per_day = 144
requests_per_run = 80
requests_per_day = 1200
score_min = 85
backup_score_min = 90
video_gap_minutes = 30
# Optional existing local recommendation/rejection and posting-queue records.
history_files = ["../../growth/original_post_decisions.json"]
queue_files = ["../../growth/opportunity_queue.json"]
evidence_hosts = [
  "x.com", "www.x.com", "twitter.com", "github.com", "raw.githubusercontent.com",
  "arxiv.org", "export.arxiv.org", "www.reuters.com", "www.bloomberg.com",
  "news.ycombinator.com", "www.reddit.com", "reddit.com", "research.google",
  "research.nvidia.com", "developer.nvidia.com", "machinelearning.apple.com",
  "www.microsoft.com", "blogs.microsoft.com", "www.amazon.science",
  "about.fb.com", "ai.meta.com", "openai.com", "www.anthropic.com",
  "docs.x.ai", "docs.anthropic.com", "platform.claude.com", "developers.openai.com",
  "www.unitree.com", "agilityrobotics.com", "www.agilityrobotics.com", "www.physicalintelligence.company"
]
search_queries = [
  "Elon Musk xAI Grok major model release capabilities official announcement",
  "OpenAI Anthropic Google DeepMind major model release research agents",
  "model agent security incident controlled evaluation attack original research corroboration",
  "Meta NVIDIA Microsoft Apple Amazon Hugging Face chips infrastructure coding image video audio breakthrough",
  "robotics Figure Boston Dynamics Unitree Agility extraordinary demonstration original",
  "Reuters Bloomberg The Verge TechCrunch artificial intelligence major development",
  "site:x.com OR site:news.ycombinator.com OR site:reddit.com extraordinary model agent demonstration original source"
]

