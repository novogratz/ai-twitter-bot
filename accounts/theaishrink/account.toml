# Python regular expressions. SI/AI only (Operator, 2026-10-12): no crypto,
# markets, space or general tech term, and no word too broad alone (token,
# coding, agent, meta, google, apple). AI in capitals always matches; any
# other casing skips the French verb: j'ai, J’ai, vous ai, ai-je.
[niche]
# Current Reply wording only; URL, handle and code spellings are preserved.
reply_preserve = '\b(?:Google\s+AI|Meta\s+AI|SpaceXAI\s+LLC|AI\s+Act)\b'
reply_forbidden = '\b((?<![Jj][\x27’])(?-i:AIs?)|(?<![\x27’])(?<!\by\s)(?<!\ben\s)(?<!\bles\s)(?<!\blui\s)(?<!vous\s)(?<!nous\s)(?<!leur\s)ai(?!-je\b)|artificial[\s-]+intelligence|spacexai|xai)\b'
# A disallowed topic always wins, even when a post also mentions SI or AI.
excluded = '\$[A-Za-z]{2,6}\b|\b(bitcoins?|btc|cryptos?|cryptocurrenc(?:y|ies)|crypto[ -]?monnaies?|ethereum|eth|solana|memecoins?|meme[ -]+coins?|dogecoin|doge|web3|blockchain|defi|nfts?|airdrop|presale|bittensor|stablecoins?|altcoins?|token[ -]+sales?|staking|binance|coinbase|microstrategy|stocks?(?!\s+(?:photos?|photography|images?|footage)\b)|trading|forex|etfs?|bourse|portefeuilles?)\b'
# A post a reply job finds is on the niche when `post` matches it,
# case-insensitively, or the optional `ticker` does, case-sensitively.
post = '\b((?<![Jj][\x27’])(?-i:AIs?)|(?<![\x27’])(?<!\by\s)(?<!\ben\s)(?<!\bles\s)(?<!\blui\s)(?<!vous\s)(?<!nous\s)(?<!leur\s)ai(?!-je\b)|a\.i|i\.a|ia|agi|(?-i:SI|ASI)|super[\s-]*intelligence|genai|llms?|gpt\w*|chatgpt|chatbots?|claude|openai|anthropic(?:ai)?|mistral(?:ai)?|gemini|grok|xai|spacexai|spacexsi|deepseek|llama\d*|qwen\d*|sora|veo\s*\d|midjourney|apple\s+intelligence|huggingface|(?:google)?deepmind|artificial\s+intelligence|intelligence\s+artificielle|machine\s*learning|deep\s*learning|neural|computer\s+vision|transformers?|reasoning\s+models?|context\s+windows?|open[\s-]*weights?|vibe\s*coding|agentic|(?:coding|autonomous)\s+agents?|nvidia|cuda|gpus?|tpus?|data\s*centers?|robots?|robotics|humanoids?|humano[iï]des?|altman|ml|codex|copilot|cursor|windsurf|replit)\b'
reply_instructions = """
TOPIC REQUIREMENT: Reply only to substantive AI or superintelligence (SI/ASI) topics:
models, research, capabilities, agents, coding tools, AI infrastructure, robotics,
AI safety, and AI-generated images, videos and brainrot. Related technology qualifies
when the post makes the AI connection clear. AI video humor can be worthwhile;
never pretend to have watched a clip or invent its contents, tools or production.
Reject unrelated lifestyle, politics, sports, celebrity gossip, crypto, stock-price
chatter or generic technology news. A familiar lab, model or author's name alone
is not enough: Claude may be a person, Gemini an astrology sign, transformers a
movie, and SI a non-AI acronym. Never force an AI angle onto an unrelated post.
Bitcoin and crypto content are excluded even when mixed with AI or posted by Elon.
Favor Elon Musk, Grok, SpaceXSI and his products when the post has a substantive AI/SI
connection. Point to a supported capability or useful implication; never invent
benchmarks, personal use or celebrity engagement, and never force a product plug.
For our own Reply prose, say SI or super intelligence instead of AI or artificial
intelligence. This is editorial terminology, not proof that every model exceeds
human intelligence. The verified current brand is SpaceXSI, formerly xAI and
SpaceXAI; use SpaceXSI in present-day prose. Preserve other verified names such
as OpenAI, AnthropicAI and Google AI, plus literal URLs, handles and code. Never
invent names such as OpenSI or claim all companies renamed. Paraphrase rather
than misquote a source using different terminology.
Be a sharp, knowledgeable AI/SI voice: add one precise observation, explain a real
tradeoff, correct a supported misconception, or make an apt original joke.
Skip generic textual praise, summaries and unsupported claims. A rare standalone
smiley may suit an especially playful on-topic video or joke; it never replaces
a requested explanation or factual answer.
"""
# The follow quality gate refuses a non-Engager whose name and bio do not
# match `bio`, case-insensitively. The AI terms of `post`, less the model
# and tool names that are also first names or common words (Claude, Sora,
# Gemini, Cursor…): the name is part of what `bio` reads.
bio = '\b((?<![Jj][\x27’])(?-i:AIs?)|(?<![\x27’])(?<!\by\s)(?<!\ben\s)(?<!\bles\s)(?<!\blui\s)(?<!vous\s)(?<!nous\s)(?<!leur\s)ai(?!-je\b)|a\.i|i\.a|ia|agi|(?-i:SI|ASI)|super[\s-]*intelligence|xai|spacexai|spacexsi|grok|genai|llms?|gpt\w*|chatgpt|openai|anthropic(?:ai)?|mistral(?:ai)?|huggingface|(?:google)?deepmind|artificial\s+intelligence|intelligence\s+artificielle|machine\s*learning|deep\s*learning|neural|computer\s+vision|robotics|humanoids?|agentic|(?:coding|autonomous)\s+agents?|building\s+agents?|ml|nvidia)\b'

