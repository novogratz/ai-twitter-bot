# The Account @TheAIShrink: what the bot says and where it looks, never how
# much it may do. BOT_ACCOUNT=theaishrink (the default) picks this folder.
# src/core/account.py reads it once at start: an unknown key or a badly typed
# value stops the start. Edit it by hand, then restart.

handle = "TheAIShrink"
# Language of the Originals: en or fr. Replies follow the parent's language.
language = "en"

[editorial]
# The angle of every trend Slot and of the Startup post.
trend_angle = "Trending: the AI topic X is talking about right now, told from a trusted source"
# Earliest first. A trend Slot takes trend_angle; the exceptional Slot takes
# only news under twelve hours old or an unusually useful source.
slots = [
    { clock = "05:00", angle = "Priority: the AI update worth understanding this morning" },
    { clock = "07:15", angle = "A useful AI workflow with a concrete first step" },
    { clock = "09:30", angle = "Priority: an AI article or model update with a sharp consequence" },
    { clock = "10:00", trend = true },
    { clock = "11:45", angle = "An AI concept explained through a clear example" },
    { clock = "13:00", trend = true },
    { clock = "14:00", angle = "A model or tool update and what changes for its users" },
    { clock = "15:00", trend = true },
    { clock = "16:15", angle = "Priority: an evidence-backed take on an AI tradeoff" },
    { clock = "18:30", angle = "A practical AI idea worth saving or sharing" },
    { clock = "20:45", angle = "Optional: an exceptional fresh AI update or unusually useful source", exceptional = true },
]
# News items: RSS or Atom feeds, read on a host of trusted_hosts only.
feeds = [
    { publisher = "OpenAI", url = "https://openai.com/news/rss.xml" },
    { publisher = "Google AI", url = "https://blog.google/technology/ai/rss/" },
    { publisher = "DeepMind", url = "https://deepmind.google/blog/rss.xml" },
    { publisher = "Hugging Face", url = "https://huggingface.co/blog/feed.xml" },
    { publisher = "NVIDIA", url = "https://blogs.nvidia.com/feed/" },
    { publisher = "Microsoft Research", url = "https://www.microsoft.com/en-us/research/feed/" },
    { publisher = "Mistral AI", url = "https://mistral.ai/rss.xml" },
    { publisher = "Replicate", url = "https://replicate.com/blog/rss" },
    { publisher = "The Decoder", url = "https://the-decoder.com/feed/" },
    { publisher = "arXiv cs.AI", url = "https://rss.arxiv.org/rss/cs.AI" },
]
# The only hosts a source, a feed or a redirect may be fetched from, over https.
trusted_hosts = [
    "openai.com", "blog.google", "deepmind.google", "huggingface.co",
    "blogs.nvidia.com", "www.microsoft.com", "mistral.ai",
    "replicate.com", "the-decoder.com", "arxiv.org",
]

# Evergreen topics fill quiet news days, rotated daily; never presented as new.
[[editorial.evergreen]]
topic = "chat_templates"
title = "Why a chat template changes model behavior"
url = "https://huggingface.co/docs/transformers/chat_templating"
publisher = "Hugging Face docs"

