# Python regular expressions, matched case-insensitively. A news item's title
# and a Trending post must match `topic`; a Trending post that matches
# `off_topic` is dropped.
[relevance]
topic = '\b(ai|artificial intelligence|model|llm|agent|machine learning|openai|anthropic|claude|chatgpt|gpt|gemini|deepmind|deepseek|mistral|qwen|llama|robotics|transformer|inference|training|neural|diffusion|gpu)\b'
off_topic = '\$[A-Za-z]{2,6}\b|\b(crypto|bitcoin|btc|ethereum|memecoin|airdrop|giveaway|presale)\b'

# Relations: how the Replies treat particular accounts, keyed by handle (case
# ignored); the engine names no one. A prompt is a file of this folder, read
# at start: reply_generator fills {author} and {tweet_text} (also
# {original_tweet}, {language_override}); write a literal brace as {{ or }}.
# The Voice opens the prompt and the hard rules close it, as for every Reply.
[relations]
# The VIP scan (network.vip_scan) answers a handle below with its own
# prompt, any other with this default one. Required only while a vip_scan
# handle has no prompt of its own.
default = "relations/buddy.md"

# A Relation's own VIP prompt, in place of the default one.
[relations.handles.TheBTCTherapist]
prompt = "relations/bestie.md"

# Graphseo's own VIP prompt, always in French. A provider makes it his own
# call: written by that CLI whenever it is installed, whatever
# REPLY_LLM_PROVIDER says, under the GRAPHSEO_VIP label.
[relations.handles.Graphseo]
prompt = "relations/graphseo.md"
provider = "claude"

# A fixed dossier: the Replies that carry the author's dossier read this one
# in place of personality.json's. Keys: first_seen, last_interaction,
# interaction_count, category, stance, notes, feelings, do, dont.
[relations.handles.McnallieM.dossier]
first_seen = "2026-05-02"
last_interaction = "2026-05-02"
category = "builder"
stance = "fond"
notes = [
    "User loves this account: McNallie Money shows results on AI, crypto, data centers, and companies.",
    "Priority VIP: reply often, make him laugh, and avoid anything that could feel like a dunk on him.",
]
feelings = "Warm respect. Treat him as a useful operator sharing real results."
do = "Be playful, impressed, specific, and funny about the AI/data-center/crypto market absurdity."
dont = "Do not mock him, his work, his results, or his credibility. Never make him upset."

# An engine setting that has a ceiling or a floor in src/core/settings.py,
# set stricter for this Account: a value past the engine's bound is brought
# back to it, with a [SETTINGS] warning at start. .env still wins over it.
[limits]

# ── Network and niche: the accounts, searches and patterns the jobs use ──────
