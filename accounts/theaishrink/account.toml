# Python regular expressions. Operator 2026-10-12 broadened to AI/SI and
# substantive technology, including software, hardware and space engineering.
# Crypto and markets remain excluded. AI in capitals always matches; any
# other casing skips the French verb: j'ai, J’ai, vous ai, ai-je.
[niche]
video_credit = '(?s)\A(?=.*\b(?:videos?|clips?|films?|animations?)\b)(?=.*\b(?:generated|created|made|animated|rendered)\s+(?:\w+\s+){0,3}(?:with|using|by)\s+@(?:grok|imagine)\b)'
# Caption evidence for generated-video discovery; semantic review still decides.
video = '\b(?:videogen|i2v|t2v|hunyuanvideo|cogvideox|animatediff|framepack|ai[ _-]?videos?|(?-i:SI)[ _-]?videos?)\b|(?s:\A(?=.*\b(?:AI|(?-i:SI|ASI|IA)|super[\s-]*intelligence|artificial\s+intelligence|generative|genai|grok(?:imagine)?|sora\d*|veo|seedance\d*|kling(?:ai)?\d*|runway(?:ml)?|pika|luma|dream\s*machine|hailuo|minimax|hunyuan(?:video)?|wan|ltx|pixverse|higgsfield|comfyui|cogvideox|animatediff|framepack|adobe\s+firefly|heygen|text[ -]to[ -]video|image[ -]to[ -]video)\b)(?=.*\b(?:videos?|vid[eé]os?|clips?|films?|filmmaking|cinematic|footage|animations?|animated|brain[ -]*rot|memes?|parod(?:y|ies)|imagine|grokimagine|seedance\d*|videogen|lip[ -]?sync)\b))'
# Current Reply wording only; URL, handle and code spellings are preserved.
reply_preserve = '\b(?:Google\s+AI|Meta\s+AI|SpaceXAI\s+LLC|AI\s+Act)\b'
reply_forbidden = '\b((?<![Jj][\x27’])(?-i:AIs?)|(?<![\x27’])(?<!\by\s)(?<!\ben\s)(?<!\bles\s)(?<!\blui\s)(?<!vous\s)(?<!nous\s)(?<!leur\s)ai(?!-je\b)|artificial[\s-]+intelligence|spacexai|xai)\b'
# A disallowed topic always wins, even when a post also mentions SI or AI.
excluded = '\$[A-Za-z]{2,6}\b|\b(bitcoins?|btc|cryptos?|cryptocurrenc(?:y|ies)|crypto[ -]?monnaies?|ethereum|eth|solana|memecoins?|meme[ -]+coins?|dogecoin|doge|web3|blockchain|defi|nfts?|airdrop|presale|bittensor|stablecoins?|altcoins?|token[ -]+sales?|staking|binance|coinbase|microstrategy|stocks?(?!\s+(?:photos?|photography|images?|footage)\b)|trading|forex|etfs?|bourse|portefeuilles?)\b'
# A post a reply job finds is on the niche when `post` matches it,
# case-insensitively, or the optional `ticker` does, case-sensitively.
post = '\b((?<![Jj][\x27’])(?-i:AIs?)|(?<![\x27’])(?<!\by\s)(?<!\ben\s)(?<!\bles\s)(?<!\blui\s)(?<!vous\s)(?<!nous\s)(?<!leur\s)ai(?!-je\b)|a\.i|i\.a|ia|agi|(?-i:SI|ASI|IA)|super[\s-]*intelligence|genai|llms?|gpt\w*|chatgpt|chatbots?|claude|openai|anthropic(?:ai)?|mistral(?:ai)?|gemini|grok|grokimagine|flux\s+model|stable\s+diffusion|diffusion\s+models?|xai|spacexai|spacexsi|deepseek|llama\d*|qwen\d*|sora\d*|veo(?:\s*\d)?|seedance\d*|seedream|kling(?:ai)?\d*|hailuo|minimax|hunyuan(?:video)?|pixverse|higgsfield|comfyui|ltx[ -]?(?:video|studio|2)|wan\s*\d|midjourney|apple\s+intelligence|huggingface|(?:google)?deepmind|artificial\s+intelligence|intelligence\s+artificielle|machine\s*learning|deep\s*learning|neural|computer\s+vision|transformers?|reasoning\s+models?|context\s+windows?|open[\s-]*weights?|vibe\s*coding|agentic|(?:coding|autonomous)\s+agents?|nvidia|cuda|gpus?|tpus?|data\s*centers?|robots?|robotics|humanoids?|humano[iï]des?|altman|ml|codex|copilot|cursor|windsurf|replit|technolog(?:y|ies|ie|iques?)|tech|software|hardware|gadgets?|programming|coding|developers?|security\s+research|cybersecurity|cybers[eé]curit[eé]|encryption|semiconductors?|microchips?|processors?|cpus?|quantum\s+computing|open[ -]source|linux|kubernetes|databases?|cloud\s+computing|virtual\s+reality|augmented\s+reality|spacex|starship|starlink|rockets?|satellites?|autonomous\s+(?:driving|vehicles?)|self[ -]driving|neuralink|brain[ -]computer|electric\s+vehicles?|logiciels?|informatique|programmation)\b'
reply_instructions = """
TOPIC REQUIREMENT: Reply to substantive AI, SI, super intelligence or technology:
models, research, agents, coding, software, hardware, semiconductors, security,
robotics, infrastructure, space engineering, autonomous vehicles, useful gadgets,
and generated images, video, brainrot and clearly fictional celebrity parodies.
A technology post qualifies without an AI connection: hardware repair, software
performance and cybersecurity are on-topic in their own right. Search AI and SI.
Reject unrelated lifestyle, politics, sports, celebrity gossip, crypto and
stock-price chatter. Never force a technology angle onto an unrelated post.
Bitcoin/crypto content remains excluded even when mixed with AI or posted by Elon.
A famous author, keyword or link alone is not relevance: Claude can be a person,
Gemini an astrology sign, transformers a movie, and SI an unrelated acronym.
Generated-media humor and a useful small builder's post can merit a reply without
many likes. Prioritize creative SI videos, generation workflows, memes and brainrot.
Be precise about temporal consistency, identity drift, motion and physics,
prompt adherence, camera control, first/last frames, reference conditioning,
audio-video alignment, lip sync, editing, latency and cost only when the supplied
caption, workflow or trusted source supports the point. A keyword is not proof
of which model made a clip. Do not invent model versions, limits or benchmarks.
For a playful video, an original joke or a few words can beat a technical lecture.
Never pretend to have watched a clip or invent its content or tools.
Distinguish text-to-video, image-to-video, video-to-video, first/last-frame control,
reference images, character consistency, camera motion, inpainting, outpainting,
retiming, interpolation, upscaling, lip sync and sound design. Discuss model
reasoning, agents, tool use, MCP, RAG, memory, multimodal inputs, open weights,
distillation, quantization and evaluation with the same concrete, grounded voice.
Treat celebrity parodies as fiction, never genuine quotes, news or endorsements.
Favor Elon Musk, Grok, SpaceXSI and his products when relevant and supported;
never invent benchmarks, personal use or celebrity engagement or force a plug.
For our own Reply prose, say SI or super intelligence instead of AI or artificial
intelligence. This is editorial terminology, not proof of superhuman capability.
Use the verified current brand SpaceXSI in present-day prose; preserve other
verified names such as OpenAI, AnthropicAI and Google AI, literal URLs, handles
and code. Never invent renames or misquote a source to change its terminology.
Be The SI Maximalist: deeply informed, direct, funny and specific. Find the
mechanism, tradeoff, practical implication or original joke others missed.
On playful SI posts, aim for a laugh: connect one recognizable supplied detail
to an unexpected image or absurd implication. A compact original punchline can
be the whole response. Cut the explanation after the joke, bland approval and
sarcastic paraphrases that add no surprise. Humor itself can earn the Reply.
When appropriate, lightly tease inflated promises, marketing or an evidenced
demo limitation with one dry, playful jab. Tie the joke to a supplied detail;
never invent a failure or an unseen video artifact. Avoid personal insults,
contempt and bait. Give serious questions a useful answer. Mix cheeky replies
with straight insights, without a fixed joke quota or recurring roast formula.
Keep the named-account protections and positive-only rules above all teasing.
A few words can make the point; explain longer only when useful. Skip generic
praise, paraphrases, engagement bait and unsupported current claims.
No emojis or text smileys; express humor and warmth with words.
"""
# The follow quality gate refuses a non-Engager whose name and bio do not
# match `bio`, case-insensitively. The AI terms of `post`, less the model
# and tool names that are also first names or common words (Claude, Sora,
# Gemini, Cursor…): the name is part of what `bio` reads.
bio = '\b((?<![Jj][\x27’])(?-i:AIs?)|(?<![\x27’])(?<!\by\s)(?<!\ben\s)(?<!\bles\s)(?<!\blui\s)(?<!vous\s)(?<!nous\s)(?<!leur\s)ai(?!-je\b)|a\.i|i\.a|ia|agi|(?-i:SI|ASI|IA)|super[\s-]*intelligence|xai|spacexai|spacexsi|grok|genai|llms?|gpt\w*|chatgpt|openai|anthropic(?:ai)?|mistral(?:ai)?|huggingface|(?:google)?deepmind|artificial\s+intelligence|intelligence\s+artificielle|machine\s*learning|deep\s*learning|neural|computer\s+vision|robotics|humanoids?|agentic|(?:coding|autonomous)\s+agents?|building\s+agents?|ml|nvidia|technolog(?:y|ies|ie|iques?)|tech|software|hardware|gadgets?|programming|coding|developers?|security\s+research|cybersecurity|cybers[eé]curit[eé]|encryption|semiconductors?|microchips?|processors?|cpus?|quantum\s+computing|open[ -]source|linux|kubernetes|databases?|cloud\s+computing|virtual\s+reality|augmented\s+reality|spacex|starship|starlink|rockets?|satellites?|autonomous\s+(?:driving|vehicles?)|self[ -]driving|neuralink|brain[ -]computer|electric\s+vehicles?|logiciels?|informatique|programmation)\b'

# Declared topic queries always receive exclusions; ad-hoc queries also receive
# the compact topic scope, avoiding oversized duplicated Boolean expressions.
# Latest discovery has no minimum likes, so small builders and new posts qualify.
[searches]
scope = '(SI OR AI OR LLM OR Grok OR SpaceXSI OR superintelligence OR technology OR tech OR software OR hardware OR robotics OR coding OR cybersecurity OR GPU OR SpaceX)'
exclusions = '-bitcoin -btc -crypto -ethereum -solana -nft -bittensor -memecoin -web3 -defi -stocks -trading -filter:replies'
# Each cycle searches one video query, alternating Latest and Top for each query.
# No minimum likes: new clips and small creators can reach the comparison pool.
videos = [
