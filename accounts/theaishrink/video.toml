# Opt in with VIDEO_ENABLED=1. VIDEO_LIVE remains 0 throughout development.
# This replaces main-post editorial/repost scheduling only while enabled.
publishing_transport = "safari"
browser_upload_seconds = 180 # includes X processing after transfer; still inside slot grace
windows = ["05:00", "07:00", "09:00", "11:00", "13:00", "15:00", "17:00", "19:00", "21:00", "23:00"]
paired_windows = []
scheduled_daily_cap = 10
startup_on_boot = true
pair_minutes = 15
protect_primary_windows = true # spend extra-slot clips only above the next main windows' needs
preparation_lead_seconds = 1800
initial_history_pages = 6
allow_unknown_momentum = true
allow_source_overlays = true # operator accepts retained source subtitles/credits, 2026-11-01
caption_disclosure = false # operator requests only the playful caption, 2026-11-01
grace_seconds = 600
min_spacing_seconds = 900
startup_seconds = 3600
day_poll_seconds = 1200
night_poll_seconds = 600
buffer_target = 16
queue_limit = 500
score_threshold = 80.0
confidence_min = 0.9
preferred_age_hours = 72
max_age_hours = 17520 # recent first; progressively older fallback up to 730 days
lease_seconds = 1200
media_job_seconds = 840
max_media_memory_mb = 2048
asset_retention_days = 14
task_timeout_seconds = 240 # bounded download time for observed slower source CDN
render_timeout_seconds = 120
max_attempts = 4
request_budget = 500
publishing_request_reserve = 40
download_budget_bytes = 2000000000
storage_budget_bytes = 5000000000
max_download_bytes = 150000000
inference_budget_usd = 0.0
inspection_cost_ceiling_usd = 0.0
max_duration_seconds = 140
render_threads = 1
max_load_per_cpu = 0.75
min_free_memory_mb = 1024
max_reply_backlog = 12
reply_latency_ratio = 1.10
min_latency_samples = 30
inspection_command = []
inspection_provider = "codex"
codex_model = "" # reuse the existing Codex Reply model in a new session
codex_timeout_seconds = 180
codex_daily_calls = 96
codex_daily_input_tokens = 2000000
codex_inspection_reserve = 48
codex_max_reply_calls = 2
inspection_fps = 1 # temporal inspection across the full clip; reserve capacity for the ready buffer
font_file = "/System/Library/Fonts/Supplemental/Arial.ttf"
watermark = "@Thesimaximalist"
media_hosts = []
local_import_roots = []
x_reads_enabled = false

[targets]
elon = ["Elon Musk", "马斯克"]
trump = ["Donald Trump", "特朗普"]
dario = ["Dario Amodei", "达里奥", "阿莫迪"]
sam = ["Sam Altman", "山姆·奥特曼"]
zuckerberg = ["Mark Zuckerberg", "Zuckerberg", "扎克伯格"]

[target_handles]
elon = "@elonmusk"
trump = "@realDonaldTrump"
sam = "@sama"
# No guessed X handles for cast members without a configured verified handle.

[platforms.instagram]
enabled = true
safari_player = true
public_search = true
public_search_seconds = 7200
creators = ["ai_xiaomu"]
permission_reference = ""
# feed = "/absolute/path/to/authorized-instagram-feed.json"
# Alternatively: provider_command = ["/absolute/path/to/licensed-provider-adapter"]

[platforms.tiktok]
enabled = true
safari_player = true
public_search = true
public_search_seconds = 7200
creators = []
permission_reference = ""

[platforms.bilibili]
enabled = true
safari_player = true
public_search = true
public_search_seconds = 7200
# Public research leads only; monitoring never grants reuse permission.
creators = ["Claude最严厉的父亲", "AI大法师"]
permission_reference = ""

[platforms.rednote]
enabled = true
safari_player = true
public_search = true
public_search_seconds = 7200
creators = []
permission_reference = ""

[platforms.x]
enabled = true
safari_player = true
public_search = true
public_search_seconds = 7200
creators = []
permission_reference = ""

# Permissions are operator records, never trusted claims from downloaded metadata.
[permissions.operator_confirmed_all_sources]
enabled = true
operator_attested = true
all_creators = true
platforms = ["instagram", "tiktok", "rednote", "bilibili", "x"]
valid_until_revoked = true
video = true
audio = true
editing = true
x_publication = true
overlay_removal = true
credit_source = false
evidence = "Operator confirmed on 2026-11-01 permission for current/future Instagram, TikTok, RedNote and Bilibili video/audio editing and X republication. On 2026-11-04 explicitly extended the instruction to X videos with no more than 50000 observed views and older fallback up to two years. This is an operator attestation, not an independently verified creator contract."

