# Opt in with VIDEO_ENABLED=1. VIDEO_LIVE remains 0 throughout development.
# 2026-11-08: exceptional video finds only. News off; clocks are opportunities, not targets.
# 2026-11-23: the ultra floors never passed one clip (45 inspected, best 8/10; a 1.7M-play reel scored 5.5).
# The Operator asks for bangers again and leaves the bar to the agent: an Instagram audience proves the
# banger, the inspector still checks cast, portrayal, safety, quality and the cut. See docs/EDITORIAL_POLICY.md.
publishing_transport = "safari"
browser_upload_seconds = 180 # includes X processing after transfer; still inside slot grace
# Operator, 2026-11-24: one video at 7 AM, 9 AM, noon, 5 PM and 9 PM Toronto, every day.
windows = ["07:00", "09:00", "12:00", "17:00", "21:00"]
paired_windows = []
scheduled_daily_cap = 5
auto_edit = true
source_max_duration_seconds = 300
edit_min_seconds = 8
edit_max_seconds = 120
min_hook_score = 6
bangers_only = true
ultra_bangers_only = false
banger_component_min = 5.5   # hook/payoff, performance, quality, each /10
banger_fit_min = 7           # cast and account fit, /10
banger_floors = [14, 12, 9]  # fit /20, entertainment /20, quality /15
audience_min_views = 50000   # Instagram plays shown on the creator grid
audience_min_likes = 2000    # or likes on the exact reel page; one of the two is enough
editorial_taste = """Qualifying cast: Donald Trump, Elon Musk, Jensen Huang, Dario Amodei, Sam Altman or Mark Zuckerberg. \
When Trump or Elon appear they must look good: cool, charismatic, funny with the joke on their side, winning. \
A clip that mocks, humiliates, weakens or makes either of them look bad is brand_fit=false. The other four can be \
teased playfully. Prefer funny clips, songs and musical numbers, and short cuts: when a 10-30 second excerpt holds \
the joke or the chorus, choose it over a longer one."""
one_line_caption = true
short_caption = true # Operator, 2026-11-24: "Jensen VS Dario" plus one heart; short and sweet
discovery_prompt_file = "video_discovery_prompt.md"
discovery_memory_file = "video_memory.json"
query_bank_file = "video_query_bank.txt"
adaptive_discovery = true
discovery_calls_per_hour = 1 # web search finds almost nothing on Instagram; keep Codex for inspection
ready_reserve_min = 1
banger_min_score = 62.0
x_max_views = 50000
x_reach_max_age_seconds = 21600
startup_on_boot = false
pair_minutes = 15
protect_primary_windows = true # spend extra-slot clips only above the next main windows' needs
preparation_lead_seconds = 1800
initial_history_pages = 6
allow_unknown_momentum = true
allow_source_overlays = true # operator accepts retained source subtitles/credits, 2026-11-01
caption_disclosure = false # operator requests only the playful caption, 2026-11-01
grace_seconds = 600
min_spacing_seconds = 900
startup_seconds = 3600
day_poll_seconds = 1200
night_poll_seconds = 600
buffer_target = 3
queue_limit = 500
score_threshold = 80.0 # preserved raw ranking; banger_min_score controls the new editorial rubric
confidence_min = 0.85 # 2026-11-23: the inspector reported 0.89 on a clean 1.7M-play reel; the default stays 0.9
preferred_age_hours = 72
max_age_hours = 17520 # recent first; progressively older fallback up to 730 days
lease_seconds = 1200
media_job_seconds = 840
max_media_memory_mb = 2048
asset_retention_days = 14
task_timeout_seconds = 240 # bounded download time for observed slower source CDN
render_timeout_seconds = 120
max_attempts = 4
request_budget = 3000 # 2026-11-24: X HLS segments spent the shared 460 by 07:00 and every Instagram capture deferred all morning
publishing_request_reserve = 40
download_budget_bytes = 4000000000
storage_budget_bytes = 5000000000
max_download_bytes = 150000000
inference_budget_usd = 0.0
inspection_cost_ceiling_usd = 0.0
max_duration_seconds = 140
render_threads = 1
max_load_per_cpu = 0.75
min_free_memory_mb = 1024
max_reply_backlog = 12
reply_latency_ratio = 1.10
min_latency_samples = 30
inspection_command = []
inspection_provider = "codex"
# 2026-11-23: pinned. Blank reuses REPLY_MODEL, which became a Grok model on 2026-11-21:
# Codex refused it and every inspection and public search failed from then on.
codex_model = "gpt-6.1-sol"
codex_timeout_seconds = 180
codex_daily_calls = 240 # 2026-11-23: inspection was the bottleneck (37 calls spent the old token budget)
codex_daily_input_tokens = 8000000
codex_inspection_reserve = 200
codex_max_reply_calls = 2
inspection_fps = 1 # temporal inspection across the full clip; reserve capacity for the ready buffer
font_file = "/System/Library/Fonts/Supplemental/Arial.ttf"
watermark = "@thesimaximalist"
media_hosts = []
local_import_roots = []
x_reads_enabled = false

[targets]
elon = ["Elon Musk", "Elon", "马斯克"]
trump = ["Donald Trump", "Trump", "特朗普", "川普"]
dario = ["Dario Amodei", "Dario", "达里奥", "阿莫迪"]
sam = ["Sam Altman", "Altman", "山姆·奥特曼", "奥特曼"]
jensen = ["Jensen Huang", "Jensen", "黄仁勋", "老黄"]
zuck = ["Mark Zuckerberg", "Zuckerberg", "Zuck", "扎克伯格", "小扎"]  # Operator, 2026-11-23

[target_handles]
elon = "@elonmusk"
trump = "@realDonaldTrump"
sam = "@sama"
# No guessed X handles for cast members without a configured verified handle.

[platforms.instagram]
weight = 40
enabled = true
safari_player = true
public_search = true
public_search_seconds = 3600
creators = ["ai_xiaomu"]
permission_reference = ""
# 2026-11-23: web search is blind on Instagram. Read its own pages in the signed-in
# Safari session instead: each creator's Reels grid (with the displayed play counter)
# and Instagram keyword search. Creators whose inspected reel showed a target in a
# synthetic parody join the grid rotation on their own. Leads only; every gate still decides.
safari_browse = true
browse_seconds = 300        # one grid or search page per five minutes at most (operator: push harder, 2026-11-23)
browse_scrolls = 2
browse_min_views = 20000    # creator grids: only reels the audience already picked
browse_leads_per_read = 12
browse_queries = [
  # 2026-11-24: plain "<name> ai" finds the big reels (258K-like Jensen clips were missed by narrow dance/singing queries).
  "jensen huang ai", "elon musk ai", "trump ai", "sam altman ai", "zuckerberg ai", "dario amodei ai",
  "jensen huang ai parody", "elon musk ai parody", "trump ai parody", "trump elon ai",
  "ai jensen huang singing", "ai elon musk singing", "ai trump singing", "ai trump elon dance",
  "nvidia jensen ai meme", "tech ceo ai parody", "ai tech billionaires boy band",
  "黄仁勋 ai", "马斯克 ai", "特朗普 ai", "ai科技天团", "AI 马斯克 特朗普 跳舞",
]
# feed = "/absolute/path/to/authorized-instagram-feed.json"
# Alternatively: provider_command = ["/absolute/path/to/licensed-provider-adapter"]

